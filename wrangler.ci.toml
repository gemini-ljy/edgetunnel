# CI deployment config for edgetunnel.
#
# Kept separate from the upstream `wrangler.toml` on purpose: upstream rewrites
# the `name` field there on every release (currently "v2025..."), and editing
# that file inside the fork would collide with the daily upstream-sync merge.
# This file is ours alone, so upstream never touches it.

name = "edgetunnel"
main = "_worker.js"
compatibility_date = "2025-11-04"

# Preserve variables set at runtime through the admin panel across redeploys.
keep_vars = true

# Keep the account's workers.dev subdomain enabled as a fallback entry point.
workers_dev = true

# Pin the worker identity to the custom domain.
#
# The source derives the subscription token as MD5MD5(host + uuid), where `host`
# is env.HOST when it is set and otherwise the hostname of the incoming request.
# Without this, workers.dev and fq.bwcx5935.com would each need their own token.
# env.HOST also replaces config.HOSTS, so generated nodes always carry the custom
# domain as host/sni no matter which entry point served the request.
[vars]
HOST = "fq.bwcx5935.com"

[[kv_namespaces]]
binding = "KV"
id = "dec45813ed484e5fb283eca36d2844ca"

# Custom domain, managed declaratively by CI (originally created via the API).
[[routes]]
pattern = "fq.bwcx5935.com"
custom_domain = true
zone_id = "df305adf94604a9371b2ca44d24c6bbc"
